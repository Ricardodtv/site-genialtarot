<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Promoção — Genial Tarot · Mestre Alberto</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<!-- promo.html — 27/11/2026, regra dele: a página TEMPORÁRIA de todas as promoções. Lê a promoção de promos.js (?p=<id>),
     mostra os produtos, pede os dados e paga pela etiqueta mypos.com/@genialtarot/<valor> através da pagar.html
     (que mostra o motivo para copiar). Fora do prazo diz «terminou» e manda para a loja. Sem indexar (é temporária). -->
<style>
  :root{--ouro:#ffd978;--ouro2:#e2a93a;--txt:#f3eaf7;--suave:#cbb8dc}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--txt);background:radial-gradient(ellipse at 50% 0%,#4a1470 0%,#1c0630 40%,#07010d 100%) fixed;min-height:100vh}
  .wrap{max-width:46rem;margin:0 auto;padding:1rem 1rem 3rem}
  .voltar{display:inline-block;color:var(--suave);text-decoration:none;font-size:.9rem;margin:.3rem 0 .8rem}
  .hero img{width:100%;height:auto;border-radius:1.2rem;border:2px solid var(--ouro);box-shadow:0 0 40px rgba(170,60,255,.55);display:block}
  h1{font-family:Cinzel,serif;font-weight:900;color:var(--ouro);text-align:center;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.15;margin:1.1rem 0 .4rem}
  .sub{text-align:center;color:var(--suave);font-size:1.05rem;margin:0 0 1rem}
  .contagem{display:flex;justify-content:center;gap:.5rem;margin:.6rem 0 1.2rem}
  .contagem div{background:rgba(10,2,16,.75);border:1.5px solid var(--ouro);border-radius:.8rem;padding:.45rem .7rem;text-align:center;min-width:4rem}
  .contagem b{display:block;font-family:Cinzel,serif;font-size:1.6rem;color:#fff;font-variant-numeric:tabular-nums}
  .contagem small{font-size:.7rem;letter-spacing:.12em;color:#ff9a9a;font-weight:800;text-transform:uppercase}
  .itens{display:grid;gap:.7rem;margin:1rem 0}
  .item{display:flex;gap:.8rem;align-items:flex-start;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1.5px solid rgba(255,217,120,.45);border-radius:1rem;padding:.9rem 1rem}
  .item .ic{flex:none;font-size:1.7rem;line-height:1}
  .item h3{margin:0;font-size:1.08rem;color:#fff}
  .item p{margin:.25rem 0 0;color:var(--suave);font-size:.92rem;line-height:1.4}
  .item .pr{margin-left:auto;text-align:right;flex:none;font-weight:800;color:var(--ouro);white-space:nowrap}
  .item .of{display:inline-block;background:#d81f2a;color:#fff;border-radius:.5rem;padding:.1rem .45rem;font-size:.75rem;font-weight:900;letter-spacing:.05em}
  .item .of + s{display:block;color:var(--suave);font-weight:600;font-size:.85rem;margin-top:.2rem}
  .total{text-align:center;margin:1.2rem 0}
  .total s{color:var(--suave);font-size:1.3rem;text-decoration-color:#d81f2a;text-decoration-thickness:3px}
  .total .agora{display:block;font-family:Cinzel,serif;font-weight:900;font-size:clamp(3rem,13vw,4.4rem);color:var(--ouro);line-height:1;text-shadow:0 0 24px rgba(255,200,90,.4)}
  .total .poupa{display:inline-block;margin-top:.5rem;background:var(--ouro);color:#2a0c18;font-weight:900;border-radius:999px;padding:.3rem .9rem}
  form{background:rgba(10,2,16,.6);border:1.5px solid rgba(255,217,120,.45);border-radius:1.2rem;padding:1.1rem 1rem 1.3rem;margin-top:1.2rem}
  form h2{font-family:Cinzel,serif;color:var(--ouro);margin:0 0 .3rem;font-size:1.25rem}
  form .ajuda{color:var(--suave);font-size:.9rem;margin:0 0 .9rem;line-height:1.4}
  label{display:block;font-weight:700;font-size:.92rem;margin:.75rem 0 .3rem}
  label small{font-weight:500;color:var(--suave)}
  input{width:100%;padding:.75rem .85rem;border-radius:.7rem;border:1.5px solid #6d4b8f;background:#1a0a28;color:#fff;font:inherit;font-size:1rem}
  input:focus{outline:2px solid var(--ouro);border-color:transparent}
  .linha{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
  .rel{position:relative}
  .lista-cid{display:none;position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:.25rem;max-height:15rem;overflow-y:auto;background:#1a0a28;border:1.5px solid #6d4b8f;border-radius:.7rem}
  .lista-cid.aberta{display:block}
  .lista-cid button{display:block;width:100%;text-align:left;border:0;background:none;color:#fff;font:inherit;font-size:.95rem;padding:.6rem .9rem;cursor:pointer}
  .lista-cid button:hover,.lista-cid button.ativo{background:rgba(185,140,255,.3)}
  .lista-cid button small{color:var(--suave)}
  .ok{color:#9be79b;font-size:.85rem;margin-top:.3rem;min-height:1em}
  .check{display:flex;gap:.5rem;align-items:center;font-weight:500;margin-top:.5rem;color:var(--suave)}
  .check input{width:auto}
  .btn{display:block;width:100%;margin-top:1.2rem;padding:1rem;border:0;border-radius:999px;font:900 1.1rem Inter,sans-serif;color:#2a0c18;background:linear-gradient(135deg,#ffe9a6,var(--ouro2));cursor:pointer;box-shadow:0 0 0 0 rgba(255,215,120,.7);animation:p 1.8s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(255,215,120,.7)}80%,100%{box-shadow:0 0 0 14px rgba(255,215,120,0)}}
  .erro{display:none;margin-top:.8rem;background:#3a0b14;border:1px solid #d81f2a;border-radius:.7rem;padding:.6rem .8rem;color:#ffd0d0}
  .erro.ver{display:block}
  .seguro{text-align:center;color:var(--suave);font-size:.85rem;margin-top:.8rem}
  .fim{text-align:center;padding:3rem 1rem}
  .fim a{display:inline-block;margin-top:1rem;padding:.9rem 1.4rem;border-radius:999px;background:linear-gradient(135deg,#ffe9a6,var(--ouro2));color:#2a0c18;font-weight:900;text-decoration:none}
  @media (max-width:480px){.linha{grid-template-columns:1fr}.item .pr{font-size:.9rem}}
  @media (prefers-reduced-motion:reduce){.btn{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><p style="text-align:center;color:#cbb8dc;padding:3rem 0">A carregar a promoção…</p></div>
<script src="/promos.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), id = q.get("p") || "", P = (window.PROMOS || {})[id];
  var app = document.getElementById("app");
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var agora = Date.now();
  var dentro = P && agora >= Date.parse(P.inicio) && agora <= Date.parse(P.fim);
  if (q.get("promo") === "ver" && P) dentro = true;                 // para conferir o aspecto fora do prazo
  if (!dentro) {
    app.innerHTML = '<a class="voltar" href="/">← genialtarot.com</a><div class="fim"><div style="font-size:3rem">🌙</div>'
      + '<h1>' + (P ? "Esta promoção já terminou" : "Promoção não encontrada") + '</h1>'
      + '<p class="sub">Obrigado pelo interesse. Na loja encontra todos os mapas, guias e consultas do Mestre Alberto.</p>'
      + '<a href="/loja?de=promo-terminou&c=' + encodeURIComponent(id) + '">Ver a loja →</a></div>';
    return;
  }
  document.title = P.titulo + " — Genial Tarot";
  var icones = ["🔢", "🔮", "💗", "🗺️", "🌟"];
  var pedeNasc = (P.pede || []).indexOf("nascimento") >= 0;
  // 27/11 (ele): quem vem do email VIP traz o seu código (t) e os sinais do que já sabemos (tem: d=data, c=cidade, h=hora).
  // Os dados NUNCA vêm no endereço: o cerebro junta-os a partir da ficha. Aqui só se pede o que falta.
  var tok = /^[0-9a-f]{16,40}$/.test(q.get("t") || "") ? q.get("t") : "", tem = tok ? (q.get("tem") || "") : "";
  var falta = { d: tem.indexOf("d") < 0, c: tem.indexOf("c") < 0, h: tem.indexOf("h") < 0 };
  var h = '<a class="voltar" href="/">← genialtarot.com</a>'
    + '<div class="hero"><img src="' + esc(P.imagem) + '" alt="' + esc(P.titulo) + '" width="900" height="600"></div>'
    + '<h1>' + esc(P.titulo) + '</h1><p class="sub">' + esc(P.subtitulo) + '</p>'
    + '<div class="contagem" aria-label="Tempo até ao fim da promoção"><div><b id="cd-d">0</b><small>dias</small></div><div><b id="cd-h">00</b><small>horas</small></div><div><b id="cd-m">00</b><small>min</small></div><div><b id="cd-s">00</b><small>seg</small></div></div>'
    + '<div class="itens">';
  P.itens.forEach(function (it, i) {
    h += '<div class="item"><span class="ic">' + icones[i % icones.length] + '</span><div><h3>' + esc(it.nome) + '</h3><p>' + esc(it.nota) + '</p></div>'
      + '<div class="pr">' + (it.oferta ? '<span class="of">🎁 OFERTA</span><s>' + esc(it.preco) + '</s>' : esc(it.preco)) + '</div></div>';
  });
  h += '</div><div class="total">' + (P.antes ? 'Os ' + P.itens.length + ' valem <s>' + esc(P.antes) + '</s>' : '') + '<span class="agora">' + esc(P.preco) + '</span>'
    + (P.poupa ? '<span class="poupa">' + esc(P.poupa) + '</span>' : '') + '</div>'
    + '<form id="f" novalidate>' + (tok ? '<h2>👑 Cliente VIP</h2><p class="ajuda">Já temos os seus dados e enviamos os mapas para o email onde recebeu este convite.'
        + (pedeNasc && (falta.d || falta.c) ? ' Só falta:' : (pedeNasc && falta.h ? ' Se souber a hora de nascimento, acrescente-a (deixa os mapas mais certos).' : ' Basta carregar no botão.')) + '</p>'
      : '<h2>Os seus dados</h2><p class="ajuda">' + (pedeNasc ? 'Os mapas são feitos à medida com os seus dados de nascimento e chegam-lhe por email.' : 'Enviamos tudo para o seu email.') + '</p>'
        + '<label for="nome">Nome completo <small>(como no registo de nascimento)</small></label><input id="nome" required maxlength="120" autocomplete="name">'
        + '<label for="email">Email <small>(é para lá que enviamos)</small></label><input id="email" type="email" required maxlength="120" autocomplete="email">')
    + (pedeNasc && falta.d ? '<label for="data">Data de nascimento</label><input id="data" type="date" required>' : '')
    + (pedeNasc && falta.h ? '<label for="hora">Hora de nascimento <small>(se souber — deixe em branco se não souber)</small></label><input id="hora" type="time">' : '')
    + (pedeNasc && falta.c ? '<label for="cidade">Cidade onde nasceu <small>(escreva e escolha na lista)</small></label><div class="rel"><input id="cidade" required maxlength="80" autocomplete="off">'
      + '<div class="lista-cid" id="lista-cid" role="listbox"></div></div><div class="ok" id="cidade-ok"></div>' : '')
    + (tok ? '' : '<label for="tel">WhatsApp <small>(opcional, só se houver alguma dúvida)</small></label><input id="tel" type="tel" maxlength="30" autocomplete="tel">')
    + '<button class="btn" type="submit">🖤 Quero aproveitar — ' + esc(P.preco) + '</button>'
    + '<div class="erro" id="erro"></div><p class="seguro">🔒 Pagamento seguro com cartão (myPOS) · ⏳ termina a ' + new Date(P.fim).toLocaleString("pt-PT", { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Lisbon" }) + '</p></form>';
  app.innerHTML = h;

  var $ = function (x) { return document.getElementById(x); };
  function tique() {
    var s = Math.max(0, Math.floor((Date.parse(P.fim) - Date.now()) / 1000));
    if (s <= 0 && q.get("promo") !== "ver") { location.reload(); return; }
    $("cd-d").textContent = Math.floor(s / 86400); $("cd-h").textContent = ("0" + Math.floor(s % 86400 / 3600)).slice(-2);
    $("cd-m").textContent = ("0" + Math.floor(s % 3600 / 60)).slice(-2); $("cd-s").textContent = ("0" + s % 60).slice(-2);
  }
  tique(); setInterval(tique, 1000);

  // a mesma lista de cidades do Mapa do Amor (cidades.json): os geradores do cerebro procuram lá a cidade, por isso escolhe-se da lista
  var CID = null, carregando = null, escolhida = null, opcoes = [], ativo = -1;
  var sem = function (t) { return String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim(); };
  function carregar() {
    if (CID) return Promise.resolve(CID);
    if (!carregando) carregando = fetch("/cidades.json?v=1").then(function (r) { return r.json(); }).then(function (d) { d.cidades.forEach(function (c) { c.push(sem(c[0])); }); CID = d; return d; });
    return carregando;
  }
  var rotulo = function (c) { return c[0] + (c[1] ? ", " + c[1] : "") + ", " + (CID.paises[c[2]] || c[2]); };
  if (pedeNasc && $("cidade")) {
    var inp = $("cidade"), lista = $("lista-cid");
    inp.addEventListener("focus", carregar, { once: true });
    inp.addEventListener("input", function () {
      escolhida = null; $("cidade-ok").textContent = "";
      var qq = sem(inp.value);
      if (qq.length < 2) { lista.classList.remove("aberta"); return; }
      carregar().then(function () {
        var a = [], b = [];
        for (var i = 0; i < CID.cidades.length && a.length < 12; i++) { var c = CID.cidades[i]; if (c[6].indexOf(qq) === 0) a.push(c); else if (qq.length >= 3 && c[6].indexOf(qq) > 0) b.push(c); }
        opcoes = a.concat(b).slice(0, 12); ativo = -1;
        lista.innerHTML = opcoes.length ? opcoes.map(function (c, i) { return '<button type="button" role="option" data-i="' + i + '">' + esc(c[0]) + ' <small>' + esc((c[1] ? c[1] + " · " : "") + (CID.paises[c[2]] || c[2])) + '</small></button>'; }).join("")
          : '<button type="button" disabled>Não encontrei. Escreva a cidade grande mais próxima.</button>';
        lista.classList.add("aberta");
      });
    });
    var escolher = function (i) { var c = opcoes[i]; if (!c) return; escolhida = c; inp.value = rotulo(c); lista.classList.remove("aberta"); $("cidade-ok").textContent = "✓ " + rotulo(c); };
    lista.addEventListener("click", function (e) { var b = e.target.closest("button[data-i]"); if (b) escolher(+b.dataset.i); });
    inp.addEventListener("keydown", function (e) {
      if (!lista.classList.contains("aberta")) return;
      var bs = lista.querySelectorAll("button[data-i]");
      if (e.key === "ArrowDown") ativo = Math.min(ativo + 1, bs.length - 1); else if (e.key === "ArrowUp") ativo = Math.max(ativo - 1, 0);
      else if (e.key === "Enter") { if (ativo >= 0) { e.preventDefault(); escolher(ativo); } return; } else return;
      e.preventDefault(); Array.prototype.forEach.call(bs, function (b, i) { b.classList.toggle("ativo", i === ativo); });
    });
    document.addEventListener("click", function (e) { if (!e.target.closest(".rel")) lista.classList.remove("aberta"); });
  }

  $("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var erro = function (t) { $("erro").textContent = t; $("erro").classList.toggle("ver", !!t); };
    var val = function (x) { return $(x) ? $(x).value.trim() : ""; };
    var dados = { promo: id, metodo: "cartao" };
    if (tok) dados.token = tok;
    else {
      dados.name = val("nome"); dados.email = val("email"); dados.phone = val("tel");
      if (dados.name.length < 3) return erro("Escreva o seu nome completo, por favor.");
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(dados.email)) return erro("Escreva o seu email, por favor: é para lá que enviamos os mapas.");
    }
    if (pedeNasc) {
      if ($("data")) {
        var d = $("data").value;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return erro("Escreva a sua data de nascimento, por favor.");
        var p = d.split("-"); dados.date_of_birth = p[2] + "/" + p[1] + "/" + p[0];
      }
      if ($("hora") && $("hora").value) dados.birth_time = $("hora").value;
      if ($("cidade")) {
        if (!escolhida) return erro("Escolha a cidade onde nasceu na lista que aparece ao escrever.");
        dados.city = escolhida[0] + (escolhida[1] ? " (" + escolhida[1] + ")" : ""); dados.country = CID.paises[escolhida[2]] || escolhida[2];
      }
    }
    erro("");
    var base = "PK" + Date.now().toString(36).slice(-5).toUpperCase();   // o código do pack; cada mapa leva o prefixo que o enviar-mapa.py conhece
    // UM pedido para o pack inteiro: o cerebro (~/promocoes-pack/pack.py) junta a ficha, espera o pagamento, faz os mapas e envia
    dados.pack = base;
    try { fetch("/notify", { method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true, body: JSON.stringify({ type: "pack-pedido", data: dados }) }); } catch (e) {}
    var link = "https://mypos.com/@genialtarot/" + P.valor;
    location.href = "/pagar.html?u=" + encodeURIComponent(link) + "&n=" + encodeURIComponent(P.titulo + " · pedido " + base) + "&v=" + encodeURIComponent(P.preco);
  });
})();
</script>
<script src="/data-facil.js" defer></script>
<script src="/vivo.js" defer></script>
</body>
</html>
